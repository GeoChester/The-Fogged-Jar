<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Fogged Jar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500&family=Alegreya:ital@0;1&display=swap">
<style>
/* Layout: one centered column. A gothic title, three breath marks for the levels, then the hero: a tall misted
   jar drawn on canvas that you wipe and lasso with your finger. A soul tally under it; music in the corner.
   Single dark look by choice: slate-blue night, cold breath-white fog, warm candle accents. */
:root{
  --night:#080b10;   /* page */
  --slate:#151c27;   /* panels */
  --fog:#d9e2ea;     /* breath on glass, text */
  --mist:#8fa0b3;    /* muted text */
  --wisp:#c7fff0;    /* good souls */
  --wicked:#ff4b3e;  /* the wicked soul */
  --candle:#ffcc7a;  /* catches, coordinates */
  --display:"Grenze Gotisch","UnifrakturCook",Georgia,serif;
  --body:"Alegreya",Georgia,serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--fog);min-height:100%}
body{font-family:var(--body);font-size:18px;line-height:1.5;padding-block:18px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse 60% 45% at 50% 50%,rgba(140,170,200,.10),transparent 70%);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px}

.breaths{display:flex;gap:14px}
.breaths svg{width:24px;height:16px}

.breaths .done path{stroke:var(--fog);filter:drop-shadow(0 0 4px #cfe0ee)}
#stage{position:relative;width:100%;max-width:520px;touch-action:none;user-select:none;-webkit-user-select:none}
#c{display:block;width:100%;height:auto;cursor:crosshair}

  font-family:var(--display);font-size:clamp(34px,10vw,56px);line-height:1.05;color:var(--candle);text-shadow:0 0 10px rgba(255,200,120,.9),0 0 30px rgba(255,160,60,.5);animation:appear 2.8s ease-out both}

.warm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff8a3d,var(--candle))}
.warm.cold svg{fill:#6d8095;filter:none}.warm.cold i{background:#6d8095}
#msg{min-height:1.5em;margin:0;font-style:italic;color:var(--mist);text-align:center}
.again{font:inherit;font-size:19px;margin-top:6px;min-height:44px;padding:8px 26px;background:var(--slate);border:1px solid #6d8095;border-radius:999px;cursor:pointer;box-shadow:0 0 18px rgba(160,190,220,.25)}
button{font:inherit;color:var(--fog);cursor:pointer}

#music{position:fixed;right:max(12px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:20;font-size:15px;padding:6px 12px;background:rgba(21,28,39,.92);border:1px solid #2e3a4a;border-radius:10px}

.start.gone{opacity:0;pointer-events:none;transition:opacity .7s}

.admin{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(4,6,10,.82);padding:0 16px}

<div class="start" id="start"><div class="card">
  <h2>The Fogged Jar</h2>
  <p>Wipe the misted glass to find the souls, then draw a ring around one to trap it. Your thread is short and your finger grows cold, so choose carefully.</p>
  <button id="go" type="button">Breathe on the glass</button>
</div></div>

<div class="wrap">

  <div class="tally" id="tally" aria-live="polite"></div>

</div>
<button id="music" type="button" aria-pressed="false">♪ Music off</button>
<div class="admin" id="admin" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="apwl">

  <div class="row"><button id="acancel" type="button">Cancel</button><button id="aok" type="button">Open</button></div>
</div></div>

<script>

const LEVELS=[

let lv=0,souls=[],caught=0,need=0,playing=false,won=false,busy=false,T=0,warmth=1,still=false;

/* ---------- canvas setup ---------- */
const cv=$("c"),g=cv.getContext("2d");
const fogC=document.createElement("canvas"),fg=fogC.getContext("2d");
const fogFull=document.createElement("canvas"),ff=fogFull.getContext("2d");

function bodyPath(c,inset=0){const {x,y,w,h,r}=B;const X=x+inset,Y=y+inset,Wd=w-2*inset,Hd=h-2*inset,R=Math.max(4,r-inset);

// a cold, cloudy layer of breath with a few beads of condensation
function makeFog(){

  ff.fillStyle="rgb(150,166,184)";ff.fillRect(0,0,W,H);
  for(let i=0;i<220;i++){const x=Math.random()*W,y=Math.random()*H,r=20+Math.random()*70,a=.05+Math.random()*.08,gr=ff.createRadialGradient(x,y,0,x,y,r);
    const tone=Math.random()<.5?"205,216,228":"112,128,148";gr.addColorStop(0,`rgba(${tone},${a})`);gr.addColorStop(1,`rgba(${tone},0)`);ff.fillStyle=gr;ff.fillRect(x-r,y-r,r*2,r*2);}
  for(let i=0;i<90;i++){const x=B.x+Math.random()*B.w,y=B.y+Math.random()*B.h,r=1+Math.random()*3.2;
    ff.fillStyle="rgba(120,135,150,.35)";ff.beginPath();ff.arc(x,y+r*.4,r,0,7);ff.fill();ff.fillStyle="rgba(255,255,255,.6)";ff.beginPath();ff.arc(x-r*.3,y-r*.3,r*.35,0,7);ff.fill();}

let lastW=0;const GW=48,GH=58,gridC=document.createElement("canvas");gridC.width=GW;gridC.height=GH;const gc=gridC.getContext("2d",{willReadFrequently:true});let grid=null,gridT=0;

addEventListener("resize",()=>{const w=$("stage").clientWidth;if(Math.abs(w-lastW)>2){lastW=w;size();}});

/* ---------- souls ---------- */
function inBody(x,y,m){return x>B.x+m&&x<B.x+B.w-m&&y>B.y+m&&y<B.y+B.h-m;}
function place(){let x,y;for(let n=0;n<400;n++){x=B.x+40+Math.random()*(B.w-80);y=B.y+50+Math.random()*(B.h-100);if(souls.every(s=>Math.hypot(s.x-x,s.y-y)>90))break;}return [x,y];}
function spawn(){
  const L=LEVELS[lv];souls=[];let ci=0;
  for(let i=0;i<L.good;i++){const [x,y]=place();souls.push(mk(x,y,"good",GOOD[ci++%GOOD.length]));}
  for(let i=0;i<L.twins;i++){const [x,y]=place();const a=mk(x,y,"twin",GOOD[ci%GOOD.length]),b=mk(x+74,y+24,"twin",GOOD[ci++%GOOD.length]);a.mate=b;b.mate=a;souls.push(a,b);}
  for(let i=0;i<L.wicked;i++){const [x,y]=place();souls.push(mk(x,y,"wicked",WICKED));}
  need=souls.filter(s=>s.kind!=="wicked").length;caught=0;tally();
}
function mk(x,y,kind,c){return {ox:x,oy:y,stay:0,limit:1.6+Math.random()*1.6,goal:null,goalT:0,x,y,vx:0,vy:0,a:Math.random()*6,kind,c,r:15,gone:false,p:Math.random()*6,mate:null,fake:GOOD[Math.floor(Math.random()*GOOD.length)],next:2+Math.random()*2,show:0};}
function moveSouls(dt){
  const L=LEVELS[lv];
  const path=ptr.down?ptr.path:null;
  souls.forEach(s=>{if(s.gone)return;
    const exposed=fogAt(s.x,s.y)<.5,spd=L.speed*(exposed?1.9:1);
    s.a+=dt*(Math.random()-.5)*(exposed?5:3);let ax=Math.cos(s.a)*spd*.6,ay=Math.sin(s.a)*spd*.6;
    // dodge the thread: keep away from its line, and slip out if it starts to curl around them

      cx/=path.length;cy/=path.length;const reach=exposed?80:55;

    if(s.goal){const gx=s.goal[0]-s.x,gy=s.goal[1]-s.y,gd=Math.hypot(gx,gy)||1;ax+=gx/gd*spd*3.2;ay+=gy/gd*spd*3.2;s.goalT-=dt;if(gd<24||s.goalT<=0)s.goal=null;}

}
function drawSoul(c,s,t){
