<title>Jar of Souls</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: one centered column under a moonless sky. A small engraved title, three moon-phase marks for the levels,
   then the hero: one big glass jar drawn on canvas, whose warped reflection is the whole game. A soul tally sits under
   the jar; music hides in the bottom-right corner. Single dark look by choice. */
:root{
  --sky:#060a17;     /* page */
  --deep:#0e1530;    /* panels */
  --silver:#e6ebff;  /* moonlight, text */
  --frost:#9fb4e8;   /* muted text, glass */
  --soul:#bff6ff;    /* soul glow */
  --amber:#ffd37a;   /* catches, coordinates */
  --display:"IM Fell English SC",Georgia,serif;
  --body:"IM Fell English",Georgia,serif;
  color-scheme:dark;
}
html,body{background:var(--sky);color:var(--silver);min-height:100%}
body{font-family:var(--body);font-size:18px;line-height:1.5;padding-block:18px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse 60% 40% at 50% 45%,rgba(90,120,220,.12),transparent 70%);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,52px);line-height:1;margin:0;color:var(--silver);letter-spacing:.04em;text-shadow:0 0 16px rgba(170,190,255,.35)}
.phases{display:flex;gap:14px}
.phases svg{width:20px;height:20px}
.phases .ring{fill:none;stroke:#3b4a7a;stroke-width:1.5}
.phases .lit{fill:#e6ebff;opacity:.15;transition:opacity .6s}
.phases .now .ring{stroke:#9fb4e8}
.phases .done .lit{opacity:1;filter:drop-shadow(0 0 4px #c8d4ff)}
#stage{position:relative;width:100%;max-width:520px;touch-action:none;user-select:none;-webkit-user-select:none}
#c{display:block;width:100%;height:auto;cursor:grab}
#c:active{cursor:grabbing}
#c:focus-visible{outline:2px solid var(--frost);outline-offset:4px;border-radius:12px}
#final{position:absolute;left:0;right:0;top:63%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;
  font-family:var(--display);font-size:clamp(28px,8.4vw,46px);line-height:1.08;color:var(--amber);text-shadow:0 0 10px rgba(255,210,120,.9),0 0 30px rgba(255,170,60,.5);animation:frost 2.6s ease-out both}
@keyframes frost{0%{opacity:0;filter:blur(12px)}60%{opacity:.9;filter:blur(2px)}100%{opacity:1;filter:none}}
.tally{display:flex;gap:8px;min-height:16px}
.tally span{width:12px;height:12px;border-radius:50%;border:1.5px solid #3b4a7a;transition:background .4s,border-color .4s,box-shadow .4s}
.tally span.got{background:var(--soul);border-color:var(--soul);box-shadow:0 0 8px var(--soul)}
#msg{min-height:1.5em;margin:0;font-style:italic;color:var(--frost);text-align:center}
.again{font:inherit;font-size:16px;background:none;border:0;color:var(--frost);text-decoration:underline;cursor:pointer;padding:4px 8px}
button{font:inherit;color:var(--silver);cursor:pointer}
button:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
#music{position:fixed;right:max(12px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:20;font-size:15px;padding:6px 12px;background:rgba(14,21,48,.9);border:1px solid #2c3a66;border-radius:10px}
#music[aria-pressed="true"]{border-color:var(--frost)}
.start{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:var(--sky);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.start .card{max-width:23em;text-align:center}
.start h2{font-family:var(--display);font-weight:400;font-size:clamp(46px,13vw,76px);line-height:1;margin:0 0 14px;color:var(--silver);text-shadow:0 0 22px rgba(170,190,255,.5)}
.start p{margin:0 0 26px;font-style:italic;color:var(--silver);font-size:clamp(22px,6vw,27px);line-height:1.45}
.start button{font-size:20px;padding:10px 26px;background:var(--deep);border:1px solid #7f95d6;border-radius:999px;box-shadow:0 0 20px rgba(140,165,255,.3)}
.start.gone{opacity:0;pointer-events:none;transition:opacity .7s}
@media (prefers-reduced-motion:reduce){#final{animation:none}}
</style>

<div class="start" id="start"><div class="card">
  <h2>Jar of Souls</h2>
  <p>The souls can only be seen in the jar's reflection. Turn and tilt the glass until the moon is true, then catch them.</p>
  <button id="go" type="button">Take up the jar</button>
</div></div>

<div class="wrap">
  <h1>Jar of Souls</h1>
  <div class="phases" id="phases" aria-label="Level 1 of 3"></div>
  <div id="stage">
    <canvas id="c" tabindex="0" aria-label="A glass jar. Drag to turn and tilt it; tap a soul in the reflection to catch it. Arrow keys also turn and tilt."></canvas>
    <div id="final" hidden><span id="fn"></span><span id="fw"></span></div>
  </div>
  <div class="tally" id="tally" aria-live="polite"></div>
  <p id="msg" role="status"></p>
  <button class="again" id="again" type="button" hidden>Play again</button>
</div>
<button id="music" type="button" aria-pressed="false">♪ Music off</button>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const FINAL=(()=>{const k=["moon","~","glass",String(9*13),"souls"].join("");let h=2166136261;for(let i=0;i<k.length;i++){h^=k.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  let a=h>>>0;const nx=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)&255;};
  const b=Uint8Array.from(atob("KXaA0CHptLImvFD67EewHsND8gehXeyfpBmU"),c=>c.charCodeAt(0)^nx());return new TextDecoder().decode(b).split("|");})();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const SAVE="jar-of-souls-moon-v1";

/* ---------- levels ---------- */
// turn: whether turning matters; drift: how fast the true angle wanders; shift: how far it jumps after each catch
const LEVELS=[{souls:4,turn:false,drift:0,shift:.0,speed:.035},{souls:5,turn:true,drift:0,shift:.35,speed:.05},{souls:6,turn:true,drift:.16,shift:.45,speed:.07}];
const OK=.085; // how close to true the jar must be for the reflection to stop lying
const SOULC=[["#bff6ff","#3fb6d9"],["#e3c8ff","#8a54d6"],["#ffc8e6","#d6549a"],["#c8ffd9","#3fbf6e"],["#fff0b8","#d1a43a"],["#d0dcff","#5a74d6"]];

let lv=0,souls=[],turn=0,tilt=0,tTurn=0,tTilt=0,caught=0,won=false,playing=false,levelBusy=false,wasTrue=false,lastLie=0,shiftedHint=false,T=0;

/* ---------- canvases ---------- */
const cv=$("c"),g=cv.getContext("2d");
const SRC=200,src=document.createElement("canvas");src.width=src.height=SRC;const sg=src.getContext("2d",{willReadFrequently:true});
const out=document.createElement("canvas");out.width=out.height=SRC;const og=out.getContext("2d");const outImg=og.createImageData(SRC,SRC);
let W=0,H=0,dpr=1,J=null;
function size(){const w=$("stage").clientWidth;dpr=Math.min(2,devicePixelRatio||1);W=w;H=Math.round(w*1.18);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";
  J={cx:W/2,cy:H*.56,rx:W*.4,ry:H*.37};}
addEventListener("resize",size);

/* ---------- the lie of the glass ---------- */
// maps a point on the glass (u,v in -1..1) to where it really comes from in the room behind it
function warp(u,v,eT,eP,t){
  const r=Math.hypot(u,v),a=Math.atan2(v,u)+eT*2.4*(1-.55*r);
  const rr=r*(1+eP*1.1*(1-r*r));
  const s=1+eP*.55;
  let x=rr*Math.cos(a)*s,y=rr*Math.sin(a)/s;
  const e=Math.min(1,Math.abs(eT)+Math.abs(eP));
  y+=.05*e*Math.sin(u*8+t*1.7);x+=.03*e*Math.sin(v*7-t*1.3);
  return [x,y];
}
function err(){return Math.hypot(LEVELS[lv].turn?turn-tTurn:0,(tilt-tTilt)*1.25);}

/* ---------- the room behind the glass ---------- */
const MOON={u:-.34,v:-.42,r:.17};
const stars=Array.from({length:60},()=>({u:Math.random()*2-1,v:Math.random()*2-1,s:Math.random()*1.4+.4,p:Math.random()*6}));
function drawRoom(t){
  const S=SRC/2,P=(u,v)=>[S+u*S,S+v*S];
  const bg=sg.createLinearGradient(0,0,0,SRC);bg.addColorStop(0,"#0c1430");bg.addColorStop(1,"#03050c");sg.fillStyle=bg;sg.fillRect(0,0,SRC,SRC);
  stars.forEach(s=>{const [x,y]=P(s.u,s.v);sg.globalAlpha=.4+.4*Math.sin(t*1.5+s.p);sg.fillStyle="#cfd8ff";sg.fillRect(x,y,s.s,s.s);});sg.globalAlpha=1;
  // the moon, with a few seas so its roundness is easy to judge
  const [mx,my]=P(MOON.u,MOON.v),mr=MOON.r*S;
  const halo=sg.createRadialGradient(mx,my,mr*.6,mx,my,mr*2.6);halo.addColorStop(0,"rgba(220,230,255,.35)");halo.addColorStop(1,"rgba(220,230,255,0)");sg.fillStyle=halo;sg.fillRect(0,0,SRC,SRC);
  const mg=sg.createRadialGradient(mx-mr*.3,my-mr*.3,mr*.1,mx,my,mr);mg.addColorStop(0,"#ffffff");mg.addColorStop(1,"#c9d2f0");sg.fillStyle=mg;sg.beginPath();sg.arc(mx,my,mr,0,7);sg.fill();
  sg.fillStyle="rgba(120,135,180,.45)";[[.3,-.2,.22],[-.25,.25,.18],[.15,.4,.12],[-.4,-.35,.1]].forEach(([a,b,r])=>{sg.beginPath();sg.arc(mx+a*mr,my+b*mr,r*mr,0,7);sg.fill();});
  // a crooked branch across the sky
  sg.strokeStyle="#02030a";sg.lineWidth=3;sg.lineCap="round";sg.beginPath();const [b0x,b0y]=P(1,-.1);sg.moveTo(b0x,b0y);const [b1x,b1y]=P(.45,-.25);sg.quadraticCurveTo(...P(.75,-.05),b1x,b1y);const [b2x,b2y]=P(.2,-.55);sg.quadraticCurveTo(...P(.3,-.3),b2x,b2y);sg.stroke();
  sg.lineWidth=1.6;sg.beginPath();sg.moveTo(...P(.62,-.15));sg.lineTo(...P(.58,-.42));sg.moveTo(...P(.38,-.36));sg.lineTo(...P(.48,-.6));sg.stroke();
  // the souls
  souls.forEach(s=>{if(s.gone)return;const [x,y]=P(s.u,s.v),r=s.r*S*(1+.06*Math.sin(t*3+s.p));
    const gl=sg.createRadialGradient(x,y,r*.2,x,y,r*2.4);gl.addColorStop(0,s.c[0]);gl.addColorStop(.35,s.c[1]+"aa");gl.addColorStop(1,s.c[1]+"00");sg.fillStyle=gl;sg.beginPath();sg.arc(x,y,r*2.4,0,7);sg.fill();
    sg.fillStyle=s.c[0];sg.beginPath();sg.arc(x,y-r*.15,r,Math.PI,0);sg.lineTo(x+r,y+r*.9);
    for(let i=0;i<3;i++){const x0=x+r-i*(2*r/3);sg.quadraticCurveTo(x0-r/3,y+r*(.55+.15*Math.sin(t*5+i)),x0-2*r/3,y+r*.9);}
    sg.closePath();sg.fill();
    sg.fillStyle="#0b0f24";sg.beginPath();sg.ellipse(x-r*.35,y-r*.2,r*.14,r*.22,0,0,7);sg.ellipse(x+r*.35,y-r*.2,r*.14,r*.22,0,0,7);sg.fill();
    sg.beginPath();sg.ellipse(x,y+r*.25,r*.13,r*.17,0,0,7);sg.fill();});
}
function renderGlass(t){
  const img=sg.getImageData(0,0,SRC,SRC).data,o=outImg.data,eT=LEVELS[lv].turn?turn-tTurn:0,eP=tilt-tTilt,S=SRC/2;
  for(let j=0;j<SRC;j++){const v=(j-S)/S;for(let i=0;i<SRC;i++){const u=(i-S)/S,k=(j*SRC+i)*4;
    if(u*u+v*v>1.02){o[k+3]=0;continue;}
    const [x,y]=warp(u,v,eT,eP,t);let si=Math.round(S+x*S),sj=Math.round(S+y*S);
    if(si<0||sj<0||si>=SRC||sj>=SRC){o[k]=3;o[k+1]=5;o[k+2]=12;o[k+3]=255;continue;}
    const q=(sj*SRC+si)*4;o[k]=img[q];o[k+1]=img[q+1];o[k+2]=img[q+2];o[k+3]=255;}}
  og.putImageData(outImg,0,0);
}

/* ---------- the jar ---------- */
function jarPath(c){const {cx,cy,rx,ry}=J;c.beginPath();c.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);}
function drawJar(t,trueNow){
  const {cx,cy,rx,ry}=J;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  // neck and cork behind the rim
  const nw=rx*.46,ny=cy-ry*.97;
  g.fillStyle="rgba(150,175,240,.06)";g.strokeStyle="rgba(200,215,255,.35)";g.lineWidth=2;
  g.beginPath();g.moveTo(cx-nw,ny+6);g.lineTo(cx-nw,ny-ry*.16);g.quadraticCurveTo(cx-nw,ny-ry*.2,cx-nw+6,ny-ry*.2);g.lineTo(cx+nw-6,ny-ry*.2);g.quadraticCurveTo(cx+nw,ny-ry*.2,cx+nw,ny-ry*.16);g.lineTo(cx+nw,ny+6);g.fill();g.stroke();
  g.fillStyle="#7a5032";g.beginPath();g.roundRect?g.roundRect(cx-nw*.82,ny-ry*.3,nw*1.64,ry*.14,5):g.rect(cx-nw*.82,ny-ry*.3,nw*1.64,ry*.14);g.fill();
  g.strokeStyle="#4f321d";g.lineWidth=1.2;for(let i=1;i<4;i++){g.beginPath();g.moveTo(cx-nw*.82+i*nw*.41,ny-ry*.3+3);g.lineTo(cx-nw*.82+i*nw*.41,ny-ry*.16-3);g.stroke();}
  // the reflection inside the glass
  g.save();jarPath(g);g.clip();g.imageSmoothingEnabled=true;g.drawImage(out,cx-rx,cy-ry,rx*2,ry*2);
  const sheen=g.createLinearGradient(cx-rx,cy-ry,cx+rx,cy+ry);sheen.addColorStop(0,"rgba(255,255,255,.10)");sheen.addColorStop(.35,"rgba(255,255,255,0)");sheen.addColorStop(1,"rgba(120,150,255,.08)");g.fillStyle=sheen;g.fillRect(cx-rx,cy-ry,rx*2,ry*2);
  g.restore();
  // glass rim: silver and singing when the reflection is true
  const k=trueNow?1:Math.max(0,1-err()/.5);
  g.lineWidth=3;g.strokeStyle=`rgba(${190+60*k|0},${205+45*k|0},255,${.35+.5*k})`;g.shadowColor=trueNow?"rgba(220,230,255,.9)":"transparent";g.shadowBlur=trueNow?18+6*Math.sin(t*4):0;jarPath(g);g.stroke();g.shadowBlur=0;
  g.strokeStyle="rgba(255,255,255,.18)";g.lineWidth=4;g.lineCap="round";g.beginPath();g.ellipse(cx,cy,rx*.86,ry*.88,0,Math.PI*1.08,Math.PI*1.32);g.stroke();
  // caught souls float into the jar's base
  flights.forEach(f=>{const p=Math.min(1,(t-f.t0)/.9),e=p*p*(3-2*p),x=f.x+(cx-f.x)*e,y=f.y+(cy+ry*.82-f.y)*e-Math.sin(p*Math.PI)*60;
    g.globalAlpha=1-p*.6;const gr=g.createRadialGradient(x,y,1,x,y,18);gr.addColorStop(0,f.c[0]);gr.addColorStop(1,f.c[1]+"00");g.fillStyle=gr;g.beginPath();g.arc(x,y,18,0,7);g.fill();g.globalAlpha=1;});
  for(let i=flights.length-1;i>=0;i--)if(t-flights[i].t0>.95)flights.splice(i,1);
  ripples.forEach(r=>{const p=(t-r.t0)/.7;if(p>1)return;g.strokeStyle=`rgba(200,215,255,${.6*(1-p)})`;g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,8+p*46,0,7);g.stroke();});
  for(let i=ripples.length-1;i>=0;i--)if(t-ripples[i].t0>.7)ripples.splice(i,1);
}
const flights=[],ripples=[];

/* ---------- souls drifting in the room ---------- */
function spawn(){
  const L=LEVELS[lv];souls=[];
  for(let i=0;i<L.souls;i++){let u,v,ok=false;
    for(let n=0;n<300&&!ok;n++){u=Math.random()*1.5-.75;v=Math.random()*1.4-.55;ok=u*u+v*v<.6&&Math.hypot(u-MOON.u,v-MOON.v)>.38&&souls.every(s=>Math.hypot(s.u-u,s.v-v)>.32);}
    souls.push({u,v,hu:u,hv:v,r:.085,p:Math.random()*6,c:SOULC[i%SOULC.length],a:Math.random()*6,gone:false});}
}
function newTruth(first){
  const L=LEVELS[lv];let a,b;
  do{a=L.turn?(Math.random()*2-1)*1.1:0;b=(Math.random()*2-1)*.85;}while(first?Math.hypot(a-turn,(b-tilt)*1.25)<.55:Math.hypot(a-tTurn,b-tTilt)<L.shift*.7);
  tTurn=a;tTilt=b;
}
function moveSouls(dt,t){const L=LEVELS[lv];souls.forEach(s=>{if(s.gone)return;s.a+=dt*(.6+Math.random()*.3);
  s.hu+=Math.cos(s.a)*L.speed*dt;s.hv+=Math.sin(s.a*1.3)*L.speed*dt*.8;const d=Math.hypot(s.hu,s.hv);if(d>.78){s.hu*=.78/d;s.hv*=.78/d;s.a+=Math.PI*.7;}
  if(Math.hypot(s.hu-MOON.u,s.hv-MOON.v)<.34){s.hu+=(s.hu-MOON.u)*.05;s.hv+=(s.hv-MOON.v)*.05;}
  s.u+=(s.hu-s.u)*Math.min(1,dt*1.5);s.v+=(s.hv-s.v)*Math.min(1,dt*1.5);});
  if(L.drift){tTurn+=Math.sin(t*.37)*L.drift*dt;tTilt+=Math.cos(t*.29)*L.drift*.7*dt;tTurn=Math.max(-1.2,Math.min(1.2,tTurn));tTilt=Math.max(-.95,Math.min(.95,tTilt));}
}

/* ---------- input: drag to turn and tilt, tap to catch ---------- */
let down=null;
cv.addEventListener("pointerdown",e=>{if(!playing)return;initAudio();cv.setPointerCapture(e.pointerId);down={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,moved:false};});
cv.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-down.lx,dy=e.clientY-down.ly;
  if(!down.moved&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>7)down.moved=true;
  if(down.moved){const sc=1/Math.max(260,W);if(LEVELS[lv].turn)turn=Math.max(-1.3,Math.min(1.3,turn+dx*2.2*sc));tilt=Math.max(-1,Math.min(1,tilt+dy*1.6*sc));rub(Math.hypot(dx,dy));}
  down.lx=e.clientX;down.ly=e.clientY;});
cv.addEventListener("pointerup",e=>{if(!down)return;const d=down;down=null;if(d.moved)return;const r=cv.getBoundingClientRect();tapAt(e.clientX-r.left,e.clientY-r.top);});
cv.addEventListener("pointercancel",()=>{down=null;});
cv.addEventListener("keydown",e=>{if(!playing)return;const st=.04;initAudio();
  if(e.key==="ArrowLeft"&&LEVELS[lv].turn){turn-=st;rub(6);}else if(e.key==="ArrowRight"&&LEVELS[lv].turn){turn+=st;rub(6);}
  else if(e.key==="ArrowUp"){tilt-=st;rub(6);}else if(e.key==="ArrowDown"){tilt+=st;rub(6);}else return;e.preventDefault();});

function tapAt(x,y){
  if(levelBusy||won)return;const {cx,cy,rx,ry}=J,u=(x-cx)/rx,v=(y-cy)/ry;if(u*u+v*v>1)return;
  const eT=LEVELS[lv].turn?turn-tTurn:0,[px,py]=warp(u,v,eT,tilt-tTilt,T);
  let best=null,bd=1e9;souls.forEach(s=>{if(s.gone)return;const d=Math.hypot(px-s.u,py-s.v);if(d<bd){bd=d;best=s;}});
  if(!best||bd>best.r*1.9){ripples.push({x,y,t0:T});sTap();return;}
  if(err()<OK){best.gone=true;caught++;flights.push({x,y,c:best.c,t0:T});sCatch(caught);updateTally();
    if(caught>=souls.length)levelDone();else{const L=LEVELS[lv];if(L.shift){newTruth(false);wasTrue=false;setTimeout(sShift,250);
      if(!shiftedHint){shiftedHint=true;$("msg").textContent="The moonlight shifted. Find the true moon again.";setTimeout(()=>{if($("msg").textContent.startsWith("The moonlight"))$("msg").textContent="";},3500);}}}
  }else{best.hu=-best.hu*.8;best.hv=-best.hv*.6;best.a+=2;ripples.push({x,y,t0:T});sLie();
    if(T-lastLie>8){$("msg").textContent="The reflection lies. Make the moon true first.";lastLie=T;setTimeout(()=>{if($("msg").textContent.startsWith("The reflection"))$("msg").textContent="";},3200);}}
}

/* ---------- levels & ui ---------- */
function phases(){const p=$("phases");p.innerHTML="";p.setAttribute("aria-label",`Level ${lv+1} of 3`);
  const d=["M10 2 A8 8 0 0 1 10 18 A5 8 0 0 0 10 2Z","M10 2 A8 8 0 0 1 10 18 Z","M10 2 A8 8 0 1 1 9.99 2Z"];
  for(let i=0;i<3;i++)p.insertAdjacentHTML("beforeend",`<svg viewBox="0 0 20 20" class="${i<lv||(won&&i===lv)?"done":i===lv?"now":""}"><circle class="ring" cx="10" cy="10" r="8"/><path class="lit" d="${d[i]}"/></svg>`);}
function updateTally(){const tl=$("tally");tl.innerHTML="";souls.forEach((s,i)=>tl.insertAdjacentHTML("beforeend",`<span class="${i<caught?"got":""}"></span>`));tl.setAttribute("aria-label",`${caught} of ${souls.length} souls caught`);}
function startLevel(n){lv=n;caught=0;wasTrue=false;levelBusy=false;turn=LEVELS[n].turn?(Math.random()*.4-.2):0;tilt=Math.random()*.3-.15;spawn();newTruth(true);phases();updateTally();save();}
function levelDone(){levelBusy=true;sLevel();
  if(lv<2){$("msg").textContent=["The first jar is full.","The second jar is full."][lv];setTimeout(()=>{$("msg").textContent="";startLevel(lv+1);},2600);}
  else{won=true;save();setTimeout(()=>showFinal(true),900);}}
function showFinal(celebrate){won=true;playing=false;phases();$("fn").textContent=FINAL[0];$("fw").textContent=FINAL[1];$("final").hidden=false;$("again").hidden=false;
  $("msg").textContent="Every soul is gathered. The moon shows the way.";turn=tTurn;tilt=tTilt;if(celebrate)victory();}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({lv,won}));}catch(e){}}
$("again").onclick=()=>{won=false;playing=true;$("final").hidden=true;$("again").hidden=true;$("msg").textContent="";startLevel(0);};

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T=now/1000;
  if(playing&&!levelBusy)moveSouls(dt,T);
  const trueNow=err()<OK;if(playing&&trueNow&&!wasTrue)sTrue();wasTrue=trueNow;
  drawRoom(T);renderGlass(T);drawJar(T,trueNow||won);
  requestAnimationFrame(frame);}

/* ---------- sound ---------- */
let ctx,master,echoIn,noiseBuf,rubG=null,music=null,musicOn=false;
function initAudio(){
  if(ctx){if(ctx.state==="suspended")ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ctx.destination);
  master=ctx.createGain();master.gain.value=.9;master.connect(comp);
  echoIn=ctx.createGain();echoIn.gain.value=.5;const dl=ctx.createDelay(1);dl.delayTime.value=.33;const fb=ctx.createGain();fb.gain.value=.4;const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2400;
  echoIn.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(master);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function rub(){}
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,dur,type,gn,dest,f2,att){const o=ctx.createOscillator(),a=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(gn,t+(att||.01));a.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(a);a.connect(dest||master);o.start(t);o.stop(t+dur+.05);}
function glass(m,t,v,dest,dur){[[1,1],[2.01,.3],[3.98,.1]].forEach(([r,a])=>tone(hz(m)*r,t,(dur||1.8)/Math.sqrt(r),"sine",(v||.08)*a,dest||echoIn,0,.03));}
function sTrue(){if(!ctx)return;const t=ctx.currentTime;glass(84,t,.06);glass(91,t+.08,.04);}
function sShift(){if(!ctx)return;const t=ctx.currentTime;[88,84,81].forEach((m,i)=>glass(m,t+i*.09,.03));}
function sTap(){if(!ctx)return;tone(1800,ctx.currentTime,.08,"sine",.03);}
function sLie(){if(!ctx)return;const t=ctx.currentTime,s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),a=ctx.createGain();s.buffer=noiseBuf;f.type="bandpass";f.frequency.setValueAtTime(3000,t);f.frequency.exponentialRampToValueAtTime(600,t+.4);f.Q.value=3;
  a.gain.setValueAtTime(.12,t);a.gain.exponentialRampToValueAtTime(.0001,t+.45);s.connect(f);f.connect(a);a.connect(master);s.start(t,Math.random());s.stop(t+.5);tone(330,t,.4,"triangle",.05,master,210);}
function sCatch(n){if(!ctx)return;const t=ctx.currentTime,m=[69,72,76,79,81,84][(n-1)%6];
  tone(hz(m-12),t,.5,"sine",.07,echoIn,hz(m));glass(m+12,t+.35,.08);tone(2400,t+.42,.12,"sine",.03);}
function sLevel(){if(!ctx)return;const t=ctx.currentTime+.1;[69,72,76,81,84,88].forEach((m,i)=>glass(m,t+i*.13,.06));tone(hz(45),t,1.6,"sine",.14);}
// victory: a glass harmonica nocturne in A minor that opens into A major
function victory(){
  initAudio();if(!ctx)return;const T0=ctx.currentTime+.1,B=.45;
  const out=ctx.createGain();out.gain.value=1;out.connect(master);out.connect(echoIn);
  const CH=[[45,[57,60,64,71]],[41,[57,60,65,69]],[38,[57,62,65,69]],[40,[56,59,64,68]]];
  const MEL=[[76,0],[79,1],[83,2],[81,3.5],[77,4],[76,5],[74,6],[72,7.5],[71,8],[74,9],[76,10],[80,11]];
  CH.forEach(([b,ch],i)=>{const t=T0+i*3*B;tone(hz(b),t,3*B*1.2,"sine",.17,out,0,.2);ch.forEach((m,k)=>glass(m,t+k*.09,.035,out,2.4));});
  MEL.forEach(([m,beat])=>glass(m,T0+beat*B,.1,out,1.6));
  const TF=T0+12*B;
  tone(hz(33),TF,3.2,"sine",.2,out,0,.3);
  [57,61,64,69,73,76].forEach((m,i)=>{const o=ctx.createOscillator(),o2=ctx.createOscillator(),a=ctx.createGain();o.type="sine";o2.type="sine";o.frequency.value=hz(m);o2.frequency.value=hz(m)*1.004;
    a.gain.setValueAtTime(0,TF);a.gain.linearRampToValueAtTime(.045,TF+.5+i*.08);a.gain.setValueAtTime(.045,TF+2);a.gain.exponentialRampToValueAtTime(.0001,TF+3.4);o.connect(a);o2.connect(a);a.connect(out);[o,o2].forEach(x=>{x.start(TF);x.stop(TF+3.5);});});
  [81,85,88,93,88,93,97].forEach((m,i)=>glass(m,TF+.5+i*.12,.045,out,1.2));
}
function startMusic(){initAudio();if(!ctx||music)return;const t=ctx.currentTime,gm=ctx.createGain();gm.gain.setValueAtTime(0,t);gm.gain.linearRampToValueAtTime(.06,t+2);gm.connect(master);gm.connect(echoIn);
  const os=[45,52,57,60].map((m,i)=>{const o=ctx.createOscillator(),o2=ctx.createOscillator();o.frequency.value=hz(m);o2.frequency.value=hz(m)*1.003;o.connect(gm);o2.connect(gm);o.start();o2.start();return [o,o2];}).flat();
  const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),wg=ctx.createGain();s.buffer=noiseBuf;s.loop=true;f.type="lowpass";f.frequency.value=500;wg.gain.value=.25;s.connect(f);f.connect(wg);wg.connect(gm);s.start();
  const notes=[76,79,83,81,77,76,74,72];let k=0;const iv=setInterval(()=>{if(ctx&&Math.random()<.65)glass(notes[k++%notes.length],ctx.currentTime,.035,gm,2.2);},1700);
  music={gm,os:[...os,s],iv};}
function stopMusic(){if(!music)return;const m=music;music=null;clearInterval(m.iv);const t=ctx.currentTime;m.gm.gain.cancelScheduledValues(t);m.gm.gain.setValueAtTime(m.gm.gain.value,t);m.gm.gain.linearRampToValueAtTime(0,t+.8);m.os.forEach(o=>o.stop(t+.9));}
$("music").onclick=e=>{musicOn=!musicOn;e.currentTarget.setAttribute("aria-pressed",musicOn);e.currentTarget.textContent=musicOn?"♪ Music on":"♪ Music off";musicOn?startMusic():stopMusic();};

/* ---------- start ---------- */
size();
let saved=null;try{saved=JSON.parse(localStorage.getItem(SAVE));}catch(e){}
if(saved&&saved.won){$("start").hidden=true;lv=2;spawn();souls.forEach(s=>s.gone=true);caught=souls.length;updateTally();showFinal(false);}
else{startLevel(saved&&Number.isInteger(saved.lv)&&saved.lv>=0&&saved.lv<3?saved.lv:0);
  $("go").onclick=()=>{initAudio();playing=true;$("start").classList.add("gone");setTimeout(()=>$("start").hidden=true,700);cv.focus({preventScroll:true});};}
requestAnimationFrame(frame);
window.__moon={truth:()=>[tTurn,tTilt],set:(a,b)=>{turn=a;tilt=b;},err,lv:()=>lv,caught:()=>caught,souls:()=>souls.map(s=>[s.u,s.v,s.gone]),tapAt,J:()=>J,warp,won:()=>won};
})();
</script>
